[package]
name = "secunzip-gui"
version = "0.1.0"
edition = "2021"
description = "SecUnzip 客户端界面"

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# 核心库
secunzip = { path = ".." }

# 文件对话框
rfd = "0.15"

# 工具
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1.10"
