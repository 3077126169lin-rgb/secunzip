[package]
name = "secunzip-gui"
version = "0.1.4"
edition = "2021"
description = "SecUnzip 客户端界面"
license = "MIT"
repository = "https://github.com/3077126169lin-rgb/secunzip"
authors = ["linkond <3077126169lin-rgb@users.noreply.github.com>"]

[dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# 核心库
secunzip = { path = ".." }

# 文件对话框
rfd = "0.15"

# 工具
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing-subscriber = "0.3"
