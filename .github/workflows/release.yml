name: Release

# 打 tag（如 v0.1.0）即自动构建并发布：
#   - SecUnzip-Setup.exe（安装包，自带卸载程序，见 docs/release.md）
#   - 独立的 CLI 与服务端可执行文件
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 静态链接 CRT：产物不依赖 VC++ Redistributable，
      # 与本地 MinGW 构建产物的"零运行库依赖"特性一致
      - name: 构建三个 crate
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --workspace

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # installer.iss 的 [Files] 读取 target\release\{...}，
      # 上面的构建正好落在这些路径，无需搬运
      - name: 生成安装包
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem output

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/SecUnzip-Setup.exe
            target/release/secunzip.exe
            target/release/secunzip-server.exe
          generate_release_notes: true
