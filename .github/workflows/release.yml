name: Release

# 打 tag（如 v0.1.0）即自动构建并发布：
#   - SecUnzip-Setup.exe（安装包，自带卸载程序，见 docs/release.md）
#   - 独立的 CLI 与服务端可执行文件
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 静态链接 CRT：产物不依赖 VC++ Redistributable，
      # 与本地 MinGW 构建产物的"零运行库依赖"特性一致
      - name: 构建三个 crate
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --workspace

      # tag 与版本号必须一致。清单靠人记已经失效过：v0.1.0 至 v0.1.3 的产物全都自报 0.1.0。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $root = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          foreach ($f in @('Cargo.toml','gui/Cargo.toml','server/Cargo.toml')) {
            $v = (Select-String -Path $f -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            if ($v -ne $root) { throw "$f 的版本 $v 与根 Cargo.toml 的 $root 不一致" }
          }
          $iss = (Select-String -Path installer.iss -Pattern 'MyAppVersion "([^"]+)"').Matches[0].Groups[1].Value
          if ($iss -ne $root) { throw "installer.iss 的 MyAppVersion $iss 与版本 $root 不一致" }
          if ($tag -ne "v$root") { throw "tag $tag 与 Cargo.toml 版本 $root 不一致（应为 v$root）" }
          Write-Host "版本校验通过：$tag"
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # installer.iss 的 [Files] 读取 target\release\{...}，
      # 上面的构建正好落在这些路径，无需搬运
      - name: 生成安装包
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem output

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/SecUnzip-Setup.exe
            target/release/secunzip.exe
            target/release/secunzip-server.exe
          generate_release_notes: true

  linux:
    name: Linux 服务端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 静态链接 musl：产物不依赖宿主的 glibc 版本，可直接丢进任何 Linux 发行版或容器
      # （软路由上的 ubuntu2 容器就是这样部署的，见 deploy/README.md）
      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: 构建服务端
        run: cargo build --release -p secunzip-server --target x86_64-unknown-linux-musl

      - name: 整理产物名
        run: cp target/x86_64-unknown-linux-musl/release/secunzip-server secunzip-server-linux-x86_64

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: secunzip-server-linux-x86_64
