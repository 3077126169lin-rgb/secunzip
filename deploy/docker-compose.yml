version: '3.8'

services:
  secunzip-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - secunzip-data:/data
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:/data/secunzip.db?mode=rwc

volumes:
  secunzip-data:
