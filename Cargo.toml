# 三个 crate 同属一个 workspace：共用一份 Cargo.lock 与根目录的 target/，
# 公共依赖（serde、tokio、reqwest、chrono 等）只编译一次。
# 此前 gui/ 与 server/ 各自一份 target，同一批依赖被编译三遍。
[workspace]
members = ["gui", "server"]
resolver = "2"

[package]
name = "secunzip"
version = "0.1.0"
edition = "2021"
description = "SecUnzip - 受控解压与内容交付工具"
license = "MIT"

[dependencies]
# 加密
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
chacha20 = "0.9"
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"

# 压缩
zip = "2.2"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }

# 工具
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "2.0"
tracing-subscriber = "0.3"
tempfile = "3.12"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# HTTP 客户端（用于服务端通信）
reqwest = { version = "0.12", features = ["json", "blocking"] }
hostname = "0.4"

# Windows 特定
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_System_Registry",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

# 内存EXE执行（RunPE 进程挖坑）—— 仅在显式启用时编译，默认关闭以避免杀软误报。
# 启用：cargo build --features runpe（届时可能被杀软标记，请知悉）。
[features]
runpe = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
