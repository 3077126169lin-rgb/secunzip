[package]
name = "secunzip-server"
version = "0.1.0"
edition = "2021"
description = "SecUnzip 授权服务端 - 仅密钥下发"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
