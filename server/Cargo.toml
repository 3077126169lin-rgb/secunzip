[package]
name = "secunzip-server"
version = "0.1.4"
edition = "2021"
description = "SecUnzip 授权服务端 - 仅密钥下发"
license = "MIT"
repository = "https://github.com/3077126169lin-rgb/secunzip"
authors = ["linkond <3077126169lin-rgb@users.noreply.github.com>"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = "0.4"
tracing-subscriber = "0.3"
# 用户口令散列：PBKDF2-HMAC-SHA256（与主 crate 同版本，已在 workspace 锁文件与本地缓存中）
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
